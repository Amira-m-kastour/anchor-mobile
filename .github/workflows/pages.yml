name: Publish the web app (GitHub Pages)
# Settings > Pages > Source: "GitHub Actions". Then every push to main publishes app/ at
# https://<user>.github.io/anchor-mobile/
on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
      - id: d
        uses: actions/deploy-pages@v4
